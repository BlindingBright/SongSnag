name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's system libraries (the Library window tests run Qt offscreen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Installer script syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh && bash -n uninstall.sh
