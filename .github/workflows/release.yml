name: Release

# Push a tag like v1.0.0 to build the Windows installer and Python packages
# and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        # Qt 6.10+ needs Windows' icuuc.dll (Windows 10 1903+); 6.9 runs on every Windows 10/11.
        run: pip install . pyinstaller "PySide6-Essentials==6.9.3"
      - name: Test
        run: |
          pip install pytest
          pytest -q
      - name: Fetch ffmpeg and Deno to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/bin | Out-Null
          # The "shared" build: ffmpeg and ffprobe share one set of DLLs (~100 MB smaller than two static exes).
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item ffmpeg/*/bin/ffmpeg.exe, ffmpeg/*/bin/ffprobe.exe, ffmpeg/*/bin/*.dll packaging/bin/
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath packaging/bin
      - name: Build app
        run: pyinstaller --noconfirm packaging/songsnag.spec
      - name: Smoke test the frozen app
        shell: pwsh
        run: |
          $p = Start-Process dist/SongSnag/SongSnag.exe -ArgumentList '--version' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "SongSnag.exe --version failed" }
      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "import songsnag; print(songsnag.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\songsnag.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/SongSnag-Setup-*.exe

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
