[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "songsnag"
dynamic = ["version"]
description = "Tray app that saves the music you play on YouTube in Brave, Chrome or Edge, as MP3 or the original stream."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "BlindingBright" }]
keywords = ["youtube", "music", "brave", "chrome", "edge", "mp3", "yt-dlp", "tray", "downloader"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "PySide6-Essentials>=6.6",
    "yt-dlp[default]>=2025.11.12",
    "ytmusicapi>=1.10",
]

[project.optional-dependencies]
deno = ["deno>=2.0"]  # a JS runtime for YouTube, for machines without Deno/Node
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
songsnag = "songsnag.app:main"

[project.gui-scripts]
songsnag-gui = "songsnag.app:main"

[project.urls]
Homepage = "https://github.com/BlindingBright/SongSnag"
Issues = "https://github.com/BlindingBright/SongSnag/issues"

[tool.hatch.version]
path = "src/songsnag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/songsnag"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "packaging", "install.sh", "uninstall.sh", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
